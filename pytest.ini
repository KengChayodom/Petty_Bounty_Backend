[pytest]
# `app` is imported as a top-level package from the backend root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    integration: requires a real ephemeral Postgres (pgvector+PostGIS) via Docker/Testcontainers. Skipped unless --integration is passed.
    slow: exercises real ML models (YOLO + CLIP) against sample images. Minutes-scale; run nightly/manually via `pytest -m slow`.

# Branch-coverage gate lives in a separate invocation so the default
# `pytest` run stays fast on every save (see CLAUDE.md / README for the cmd):
#   pytest --cov=app --cov-branch --cov-report=term-missing
